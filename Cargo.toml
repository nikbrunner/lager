[package]
name = "lager"
version = "0.1.1"
edition = "2024"
description = "Declarative local Git repository manager"
license = "MIT"
repository = "https://github.com/nikbrunner/lager"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
cliclack = "=0.5.6"
crossterm = "0.29"
fs2 = "0.4"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml_edit = { version = "0.23", features = ["serde"] }
url = "2"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rustix = { version = "1.1", features = ["termios"] }
rustix-openpty = "0.2"
tempfile = "3"

[[bin]]
name = "lager"
path = "src/main.rs"
